name: iPhone-App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Xcode-Version
        run: xcodebuild -version

      - name: App bauen (ohne Signatur)
        run: |
          set -o pipefail
          xcodebuild \
            -project FamilyHub.xcodeproj \
            -target FamilyHub \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -60 || true
          # Nur weiter, wenn das Programm selbst gebaut wurde (nicht nur Bilder)
          test -f build/Release-iphoneos/Familie.app/Familie

      - name: IPA packen
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Familie.app Payload/
          zip -qry Familie.ipa Payload
          ls -lh Familie.ipa

      - name: IPA zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Familie-ipa
          path: Familie.ipa
          retention-days: 30

      - name: Build-Log bei Fehler
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
