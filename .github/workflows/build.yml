name: iPhone-App bauen

# Baut die App bei jedem Push. Sind die Apple-Secrets eingetragen
# (APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8), wird sie direkt
# für eure registrierten iPhones signiert (1 Jahr gültig). Sonst unsigniert wie bisher.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Xcode-Version
        run: xcodebuild -version

      - name: App bauen
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DIST_P12: ${{ secrets.DIST_P12 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          # Versionsnummer = Nummer des Update-Pakets (Datei VERSION), Build-Nummer zählt weiter hoch
          UPD=$(cat VERSION 2>/dev/null | tr -dc '0-9' || true)
          VER="1.0.${UPD:-${{ github.run_number }}}"
          BUILD="${{ github.run_number }}"
          if [ -n "$TEAM_ID" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$DIST_P12" ]; then
            echo "== Signierter Build mit festem Apple-Distribution-Zertifikat (Team $TEAM_ID)"
            # 1) Zertifikat in einen eigenen Schlüsselbund
            KC="$RUNNER_TEMP/sign.keychain-db"
            security create-keychain -p "" "$KC"
            security set-keychain-settings -lut 21600 "$KC"
            security unlock-keychain -p "" "$KC"
            printf '%s' "$DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
            security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple: -k "" "$KC" > /dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            CERT_SERIAL=$(openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -nokeys -passin env:DIST_P12_PASSWORD 2>/dev/null \
              | openssl x509 -noout -serial | cut -d= -f2)
            rm -f "$RUNNER_TEMP/dist.p12"
            echo "Zertifikat-Seriennummer: $CERT_SERIAL"
            # 2) Ad-hoc-Profil mit allen eingetragenen iPhones
            python3 -m pip install --quiet --user --break-system-packages pyjwt cryptography 2>/dev/null \
              || python3 -m pip install --quiet --user pyjwt cryptography
            PROFILE=$(CERT_SERIAL="$CERT_SERIAL" ENABLE_CAPS=USERNOTIFICATIONS_COMMUNICATION CAPS_OK_FILE="$RUNNER_TEMP/komm_ok" \
              python3 .github/scripts/adhoc_profile.py)
            # Mitteilungen mit Profilbild nur, wenn Apple die Fähigkeit freigeschaltet hat
            if [ -f "$RUNNER_TEMP/komm_ok" ]; then ENT=Familie-Kommunikation.entitlements; else ENT=Familie.entitlements; fi
            echo "Berechtigungen: $ENT"
            echo "Profil: $PROFILE"
            # Profil für die Mitteilungs-Erweiterung (Bilder in Mitteilungen); App-ID wird bei Bedarf angelegt
            PROFILE_NSE=$(CERT_SERIAL="$CERT_SERIAL" BUNDLE_ID=es.mohs.familie.mitteilung BUNDLE_NAME="Familie Mitteilungen" \
              PROFILE_PREFIX="Familie Mitteilung AdHoc CI" python3 .github/scripts/adhoc_profile.py)
            echo "Profil Erweiterung: $PROFILE_NSE"
            # Profil für die Klingel-Ansicht (Live-Bild beim langen Drücken)
            PROFILE_KLINGEL=$(CERT_SERIAL="$CERT_SERIAL" BUNDLE_ID=es.mohs.familie.klingel BUNDLE_NAME="Familie Klingel" \
              PROFILE_PREFIX="Familie Klingel AdHoc CI" python3 .github/scripts/adhoc_profile.py)
            echo "Profil Klingel: $PROFILE_KLINGEL"
            # Profil für die Live-Aktivität (Wäsche/Spülmaschine auf dem Sperrbildschirm)
            PROFILE_LIVE=$(CERT_SERIAL="$CERT_SERIAL" BUNDLE_ID=es.mohs.familie.live BUNDLE_NAME="Familie Live" \
              PROFILE_PREFIX="Familie Live AdHoc CI" python3 .github/scripts/adhoc_profile.py)
            echo "Profil Live: $PROFILE_LIVE"
            # 3) Archiv bauen (manuell signiert, es entstehen keine neuen Zertifikate)
            xcodebuild archive \
              -project FamilyHub.xcodeproj -scheme FamilyHub -configuration Release \
              -destination generic/platform=iOS -archivePath build/Familie.xcarchive \
              DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" FAMILIE_PROFILE_APP="$PROFILE" FAMILIE_ENTITLEMENTS="$ENT" FAMILIE_PROFILE_NSE="$PROFILE_NSE" FAMILIE_PROFILE_KLINGEL="$PROFILE_KLINGEL" FAMILIE_PROFILE_LIVE="$PROFILE_LIVE" \
              OTHER_CODE_SIGN_FLAGS="--keychain $KC" \
              MARKETING_VERSION="$VER" CURRENT_PROJECT_VERSION="$BUILD" > build.log 2>&1 || true
            grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" build.log | sort -u | head -60 || true
            cat > export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>release-testing</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>es.mohs.familie</key><string>$PROFILE</string><key>es.mohs.familie.mitteilung</key><string>$PROFILE_NSE</string><key>es.mohs.familie.klingel</key><string>$PROFILE_KLINGEL</string><key>es.mohs.familie.live</key><string>$PROFILE_LIVE</string></dict>
            <key>thinning</key><string>&lt;none&gt;</string>
          </dict></plist>
          PLIST
            xcodebuild -exportArchive -archivePath build/Familie.xcarchive \
              -exportPath export -exportOptionsPlist export.plist >> build.log 2>&1 || true
            grep -E "error:|EXPORT (SUCCEEDED|FAILED)" build.log | sort -u | head -40 || true
            security delete-keychain "$KC" || true
            test -f export/Familie.ipa
            cp export/Familie.ipa Familie.ipa
          elif [ -n "$TEAM_ID" ] && [ -n "$ASC_KEY_ID" ]; then
            echo "::error::Das Secret DIST_P12 (Apple-Distribution-Zertifikat) fehlt – siehe README, Abschnitt Signierung."
            exit 1
          else
            echo "== Unsignierter Build (keine Apple-Secrets eingetragen)"
            xcodebuild \
              -project FamilyHub.xcodeproj -target FamilyHub -configuration Release -sdk iphoneos \
              SYMROOT="$PWD/build" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              MARKETING_VERSION="$VER" CURRENT_PROJECT_VERSION="$BUILD" \
              build > build.log 2>&1 || true
            grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -60 || true
            test -f build/Release-iphoneos/Familie.app/Familie
            mkdir -p Payload
            cp -R build/Release-iphoneos/Familie.app Payload/
            zip -qry Familie.ipa Payload
          fi
          ls -lh Familie.ipa

      - name: IPA zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Familie-ipa
          path: Familie.ipa
          retention-days: 90

      - name: Build-Log bei Fehler
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
